# XcodeGen spec: `cd ios && xcodegen generate` writes ios/Suflyor.xcodeproj (not committed, see ios/.gitignore).
# Owned by WP-B (docs/ios/contratos.md, section 3.6).
name: Suflyor

options:
  bundleIdPrefix: com.example.suflyor # TODO(owner): same as AppConstants.bundleIdPrefix
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    MARKETING_VERSION: "0.11"
    CURRENT_PROJECT_VERSION: "1"
    # TODO(owner): your Apple developer team id, or set it in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Single source of truth for ids. Keep in sync with AppConstants (SuflyorDomain/SettingsAndSupport.swift).
    BUNDLE_ID_PREFIX: com.example.suflyor
    APP_GROUP: group.com.example.suflyor
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  SuflyorKit:
    path: Packages/SuflyorKit

schemes:
  Suflyor:
    build:
      targets:
        Suflyor: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Suflyor:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Suflyor
        excludes:
          - "Models/**"
          - "Resources/ios-strings/**"
          - "Info.plist"
          - "Suflyor.entitlements"
      - path: Shared
      # Optional bundled speech models (full build): folders land at the bundle root as asr-<code>/.
      # They are fetched by ios/scripts/fetch-speech-models.sh; the lite build simply doesn't have them.
      - path: Suflyor/Models/asr-ru
        optional: true
        type: folder
        buildPhase: resources
      - path: Suflyor/Models/asr-en
        optional: true
        type: folder
        buildPhase: resources
      - path: Suflyor/Models/asr-tr
        optional: true
        type: folder
        buildPhase: resources
      # Shown in Settings > About > Licenses.
      - path: ../LICENSE
        group: Legal
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        group: Legal
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: Suflyor
        INFOPLIST_FILE: Suflyor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Suflyor/Suflyor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SuflyorShare
      - target: SuflyorControls
      - framework: ../core/build/XCFrameworks/release/SuflyorCore.xcframework
        embed: false
        link: true
      - package: SuflyorKit
        product: SuflyorDomain
      - package: SuflyorKit
        product: SuflyorImporters
      - package: SuflyorKit
        product: SuflyorSpeech
      - package: SuflyorKit
        product: SuflyorSession
      - package: SuflyorKit
        product: SuflyorPrompter
      - package: SuflyorKit
        product: SuflyorCamera
    preBuildScripts:
      - name: Build SuflyorCore (Kotlin Multiplatform)
        basedOnDependencyAnalysis: false
        script: |
          # Builds the shared Kotlin core when the XCFramework is missing or older than core/src.
          set -e
          ROOT="$SRCROOT/.."
          FW="$ROOT/core/build/XCFrameworks/release/SuflyorCore.xcframework"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ ! -d "$FW" ] || [ -n "$(find "$ROOT/core/src" -type f -newer "$FW" -print -quit)" ]; then
            echo "note: building SuflyorCore.xcframework with Gradle"
            (cd "$ROOT" && ./gradlew -p core assembleSuflyorCoreReleaseXCFramework)
          fi
        showEnvVars: false

  SuflyorShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SuflyorShare
        excludes:
          - "Info.plist"
          - "SuflyorShare.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
        PRODUCT_NAME: SuflyorShare
        INFOPLIST_FILE: SuflyorShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SuflyorShare/SuflyorShare.entitlements
        SKIP_INSTALL: YES
        # Extensions may only use extension-safe API.
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: SuflyorKit
        product: SuflyorDomain

  SuflyorControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SuflyorControls
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).controls
        PRODUCT_NAME: SuflyorControls
        INFOPLIST_FILE: SuflyorControls/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Same App Group as the app: the intent leaves the requested route there.
        CODE_SIGN_ENTITLEMENTS: SuflyorControls/SuflyorControls.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: SuflyorKit
        product: SuflyorDomain
